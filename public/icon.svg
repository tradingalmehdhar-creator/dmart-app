    <path d="M 148 108 L 272 108 C 360 108 424 168 424 256 C 424 344 360 404 272 404 L 148 404 Z M 224 184 L 224 328 L 268 328 C 316 328 348 296 348 256 C 348 216 316 184 268 184 Z" fill="#ffffff"/>

